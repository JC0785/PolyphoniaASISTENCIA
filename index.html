<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#080706;color:#e4dcd0;font-family:'Montserrat',sans-serif;-webkit-tap-highlight-color:transparent}
:root{--g:#C9A96E;--gd:#8A6E45;--gl:#E8D4A8;--bg:#080706;--bg2:#0f0e0c;--bg3:#161410;--br:rgba(201,169,110,.15);--br2:rgba(201,169,110,.08);--tx:#e4dcd0;--mt:rgba(228,220,208,.42);--green:#4ade80;--amber:#fbbf24;--red:#f87171;--fn:'Montserrat',sans-serif}
input,button,select{font-family:inherit}input[type=date]{color-scheme:dark}button{cursor:pointer;-webkit-appearance:none}
.hd{position:sticky;top:0;z-index:99;background:rgba(8,7,6,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--br)}
.hd-top{display:flex;align-items:center;justify-content:space-between;padding:11px 15px}
.logo{display:flex;align-items:center;gap:9px}
#logo-img{height:24px;width:auto}
.lt{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--g);text-transform:uppercase}
.ls{font-size:8px;color:var(--mt);letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.nav{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--br2);border-radius:9px;padding:3px}
.nb{flex:1;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 7px;color:var(--mt);font-size:10px;font-weight:500;white-space:nowrap;transition:all .15s}
.nb.on{background:rgba(201,169,110,.1);border-color:var(--gd);color:var(--g);font-weight:600}
.db{background:var(--bg2);border-bottom:1px solid var(--br2);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gd);display:block;margin-bottom:3px}
.di{background:rgba(255,255,255,.04);border:1px solid var(--br);border-radius:6px;padding:6px 10px;color:var(--tx);font-size:14px;font-weight:500;outline:none}
.di:focus{border-color:var(--gd)}
.pills{display:flex;gap:5px;align-items:center}
.pl{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid}
.pg{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.3);color:var(--green)}
.pa{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3);color:var(--amber)}
.pr2{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.3);color:var(--red)}
.dot5{width:5px;height:5px;border-radius:50%;display:inline-block;flex-shrink:0}
.si{font-size:9px;color:var(--green);font-weight:500;opacity:0;transition:opacity .3s;display:flex;align-items:center;gap:4px}
.vt{display:flex;overflow-x:auto;padding:0 15px;border-bottom:1px solid var(--br2);background:var(--bg2);scrollbar-width:none}
.vt::-webkit-scrollbar{display:none}
.vtb{flex-shrink:0;padding:8px 12px;font-size:11px;font-weight:500;color:var(--mt);cursor:pointer;border-bottom:2px solid transparent;background:transparent;border-top:none;border-left:none;border-right:none;transition:all .15s;white-space:nowrap}
.vtb.on{color:var(--g);border-bottom-color:var(--g);font-weight:600}
/* Cards container - vertical scroll */
.cards-container{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
/* Member card - horizontal layout */
.mc{border-radius:14px;overflow:hidden;border:1.5px solid var(--br2);background:var(--bg2);transition:border-color .2s,box-shadow .2s}
.mc.present{border-color:rgba(74,222,128,.5);box-shadow:0 0 16px rgba(74,222,128,.1)}
.mc.absent_notified{border-color:rgba(251,191,36,.5);box-shadow:0 0 16px rgba(251,191,36,.1)}
.mc.absent_no_notice{border-color:rgba(248,113,113,.5);box-shadow:0 0 16px rgba(248,113,113,.1)}
.director-card{border-color:rgba(201,169,110,.3)}
.mac{height:2px;width:100%;background:var(--br2);transition:background .2s}
.mc.present .mac{background:rgba(74,222,128,.6)}
.mc.absent_notified .mac{background:rgba(251,191,36,.6)}
.mc.absent_no_notice .mac{background:rgba(248,113,113,.6)}
/* Inner: photo + info side by side */
.mc-inner{display:flex;align-items:stretch}
.mc-photo-wrap{flex-shrink:0;width:110px}
.mc-photo{width:110px;height:110px;object-fit:cover;object-position:top center;display:block;background:var(--bg3)}
.mc-photo-ini{width:110px;height:110px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--gd)}
.mc-info{flex:1;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mc-name{font-size:13px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-voice{font-size:9px;color:var(--mt);letter-spacing:.05em;margin-bottom:2px}
.mc-btns{display:flex;gap:5px}
.mbt{flex:1;padding:6px 2px;border-radius:6px;border:1px solid;font-size:9px;font-weight:700;text-align:center;background:transparent;transition:all .12s;white-space:nowrap}
.mbt.g{border-color:rgba(74,222,128,.25);color:rgba(74,222,128,.55)}
.mbt.aa{border-color:rgba(251,191,36,.25);color:rgba(251,191,36,.55)}
.mbt.r{border-color:rgba(248,113,113,.25);color:rgba(248,113,113,.55)}
.mbt.g.sel{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.1)}
.mbt.aa.sel{border-color:var(--amber);color:var(--amber);background:rgba(251,191,36,.1)}
.mbt.r.sel{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.1)}
.mc-stats{display:flex;gap:4px;margin-top:2px}
.mss{flex:1;text-align:center;background:rgba(255,255,255,.03);border-radius:4px;padding:3px 2px}
.mssn{font-size:11px;font-weight:700}
.mssl{font-size:7px;color:var(--mt)}
.mdl{background:transparent;border:none;color:rgba(248,113,113,.25);font-size:18px;cursor:pointer;padding:0;margin-top:2px;align-self:flex-end}
.add-member-btn{width:100%;padding:14px;border-radius:12px;border:1.5px dashed var(--br);background:transparent;color:var(--mt);font-size:12px;font-family:var(--fn);cursor:pointer;transition:all .15s;margin-top:4px}
.add-member-btn:hover,.add-member-btn:active{border-color:var(--gd);color:var(--gl)}
/* History/Stats/Informe */
.cp{padding:15px}
.st{font-size:16px;font-weight:700;color:var(--gl);margin-bottom:14px}
.hi{background:var(--bg2);border:1px solid var(--br2);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.hd2{font-size:12px;font-weight:600;color:var(--g);margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.hch{display:flex;flex-wrap:wrap;gap:4px}
.ch{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.03);border:1px solid var(--br2);border-radius:20px;padding:2px 7px;font-size:9px;color:var(--mt)}
.el{font-size:9px;color:var(--gd);cursor:pointer;background:transparent;border:1px solid var(--br);border-radius:5px;padding:3px 8px;font-family:inherit}
.sr{background:var(--bg2);border:1px solid var(--br2);border-radius:12px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.sav{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid var(--br)}
.savi{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:rgba(201,169,110,.08);border:1.5px solid var(--br);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gd)}
.sbg{height:3px;background:rgba(255,255,255,.06);border-radius:3px;margin-top:4px}
.sba{height:100%;border-radius:3px}
.em{color:var(--mt);text-align:center;padding:40px 0;font-size:13px}
.fl{margin-bottom:11px}
.eo{display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;border:1px solid var(--br2);background:rgba(255,255,255,.02);cursor:pointer;transition:all .12s}
.eo:hover,.eo:active{border-color:var(--gd);background:rgba(201,169,110,.05)}
.eo .ic{font-size:22px}
.eo strong{display:block;font-size:12px;font-weight:500}
.eo span{font-size:10px;color:var(--mt)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(5px)}
.ov.on{display:flex}
.sh{background:var(--bg2);border-radius:18px 18px 0 0;border:1px solid var(--br);border-bottom:none;padding:18px 18px 38px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto}
.hdl{width:32px;height:3px;background:var(--br);border-radius:2px;margin:0 auto 14px;display:block}
.sh h2{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--gl);text-transform:uppercase;margin-bottom:16px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gd);margin-bottom:4px}
.fld input,.fld select{width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--br);background:rgba(255,255,255,.04);color:var(--tx);font-size:14px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--gd)}
.fld select option{background:var(--bg2)}
.pu{width:100%;padding:14px;border:1px dashed var(--br);border-radius:8px;background:rgba(255,255,255,.02);text-align:center;color:var(--mt);font-size:11px;position:relative;overflow:hidden}
.pu input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.pprev{width:60px;height:60px;border-radius:50%;object-fit:cover;margin:0 auto 6px;display:none;border:1.5px solid var(--br)}
.sbs{display:flex;gap:7px;margin-top:16px}
.sbb{flex:1;padding:10px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--br);background:transparent;color:var(--tx)}
.sbb.pri{background:var(--g);color:#080706;border-color:var(--g)}
.sbb.dan{border-color:rgba(248,113,113,.4);color:var(--red)}
</style>
</head>

  <div class="hd-top">
    <div class="logo">
      <img id="logo-img" alt="">
      <div><div class="lt">Polyphonia</div><div class="ls">Asistencia</div></div>
    </div>
    <div class="nav">
      <button class="nb on" id="nb-a">Ensayo</button>
      <button class="nb" id="nb-h">Historial</button>

    </div>
  </div>
</div>
<div id="app"></div>
<div class="ov" id="sh-add"><div class="sh">
  <div class="hdl"></div><h2>Agregar integrante</h2>
  <div class="fld"><label>Foto (opcional)</label>
    <div class="pu"><input type="file" accept="image/*" id="pfile">
      <img class="pprev" id="ppreview"><div id="ptext"><div style="font-size:18px;margin-bottom:4px">&#128247;</div>Subir foto</div>
    </div>
  </div>
  <div class="fld"><label>Nombre</label><input id="nname" type="text" placeholder="Ej: María García"></div>
  <div class="fld"><label>Cuerda</label>
    <select id="nvoice"><option value="Soprano">Soprano</option><option value="Contralto">Contralto</option><option value="Tenor">Tenor</option><option value="Bajo">Bajo</option></select>
  </div>
  <div class="sbs"><button class="sbb" id="btn-cancel-add">Cancelar</button><button class="sbb pri" id="btn-confirm-add">Agregar</button></div>
</div></div>
<div class="ov" id="sh-del"><div class="sh">
  <div class="hdl"></div><h2>Eliminar integrante</h2>
  <p id="del-msg" style="color:var(--mt);font-size:13px;line-height:1.6;margin-bottom:20px"></p>
  <div class="sbs"><button class="sbb" id="btn-cancel-del">Cancelar</button><button class="sbb dan" id="btn-confirm-del">Eliminar</button></div>
</div></div>

<script>

var _md=document.getElementById('data-members').textContent;
var _ld=document.getElementById('data-logo').textContent;
var _ad=document.getElementById('data-agus').textContent;

var _b=atob(_md),_a=new Uint8Array(_b.length);
for(var _i=0;_i<_b.length;_i++)_a[_i]=_b.charCodeAt(_i);
var BASE_MEMBERS=JSON.parse(new TextDecoder('utf-8').decode(_a));
document.getElementById('logo-img').src='data:image/png;base64,'+_ld;

function decodeStr(b64){var s=atob(b64),r='';for(var i=0;i<s.length;i++)r+=String.fromCharCode(s.charCodeAt(i));return r;}
var AGUS_PHOTO=_ad?decodeStr(_ad):'';

var VOICES=['Soprano','Contralto','Tenor','Bajo'];
var VNAMES={Soprano:'Sopranos',Contralto:'Contraltos',Tenor:'Tenores',Bajo:'Bajos'};

var members=JSON.parse(localStorage.getItem('pm6')||'null')||BASE_MEMBERS.slice();
var att=JSON.parse(localStorage.getItem('pa6')||'{}');
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function clean(d){if(att[d]&&!Object.keys(att[d]).length)delete att[d];}
var view='a',selDate=today(),vf='all';
var pph='',delId=null,savedTimer=null;

function save(){localStorage.setItem('pm6',JSON.stringify(members));localStorage.setItem('pa6',JSON.stringify(att));}
function uid(){return ''+Date.now()+Math.floor(Math.random()*9999);}
function ini(n){return n.split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();}
function fdate(d){var p=d.split('-'),mo=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return parseInt(p[2])+' '+mo[parseInt(p[1])-1]+' '+p[0];}
function mstat(id){var p=0,a=0,s=0;Object.values(att).forEach(function(day){var v=day[id];if(v==='present')p++;else if(v==='absent_notified')a++;else if(v==='absent_no_notice')s++;});return{p:p,a:a,s:s};}

function setStatus(mid,status){
  if(!att[selDate])att[selDate]={};
  if(att[selDate][mid]===status)delete att[selDate][mid];
  else att[selDate][mid]=status;
  clean(selDate);
  save();
  // Update card in place without full re-render
  refreshCard(mid);
  var si=document.getElementById('si');
  if(si){si.style.opacity='1';clearTimeout(savedTimer);savedTimer=setTimeout(function(){si.style.opacity='0';},1400);}
}

function refreshCard(mid){
  var dd=att[selDate]||{};
  var status=dd[mid]||null;
  var card=document.getElementById('mc-'+mid);
  if(!card)return;
  // Update border class
  card.className='mc'+(status?' '+status:'');
  // Update accent bar
  var acc=card.querySelector('.mac');
  if(acc){acc.className='mac';}// class handled by CSS cascade
  // Update buttons
  var btns=card.querySelectorAll('.mbt');
  var vals=['present','absent_notified','absent_no_notice'];
  btns.forEach(function(btn,i){
    var base=btn.getAttribute('data-base');
    btn.className='mbt '+base+(status===vals[i]?' sel':'');
  });
  // Update stats
  var st=mstat(mid);
  var ssns=card.querySelectorAll('.mssn');
  if(ssns.length>=3){ssns[0].textContent=st.p;ssns[1].textContent=st.a;ssns[2].textContent=st.s;}
}

function sw(v){
  view=v;
  document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('on',['a','h','s','r'][i]===v);});
  render();
}
function goDate(d){selDate=d;sw('a');}

// ── ATTENDANCE — vertical scroll ──
function renderA(){
  var dd=att[selDate]||{};
  var p=Object.values(dd).filter(function(v){return v==='present';}).length;
  var an=Object.values(dd).filter(function(v){return v==='absent_notified';}).length;
  var sn=Object.values(dd).filter(function(v){return v==='absent_no_notice';}).length;

  var frag=document.createDocumentFragment();

  // Date bar
  var db=document.createElement('div');db.className='db';
  var dw=document.createElement('div');
  var dl=document.createElement('label');dl.className='dl';dl.textContent='Fecha';
  var di=document.createElement('input');di.className='di';di.type='date';di.id='dp';di.value=selDate;
  di.addEventListener('change',function(){selDate=this.value;renderA();});
  dw.appendChild(dl);dw.appendChild(di);db.appendChild(dw);
  var pills=document.createElement('div');pills.className='pills';
  [[p,'pg','--green'],[an,'pa','--amber'],[sn,'pr2','--red']].forEach(function(x){
    var pl=document.createElement('div');pl.className='pl '+x[1];
    var d5=document.createElement('span');d5.className='dot5';d5.style.background='var('+x[2]+')';
    pl.appendChild(d5);pl.appendChild(document.createTextNode(' '+x[0]));pills.appendChild(pl);
  });
  db.appendChild(pills);
  var si=document.createElement('div');si.className='si';si.id='si';
  si.innerHTML='<span class="dot5" style="background:var(--green)"></span> Guardado';
  db.appendChild(si);frag.appendChild(db);

  // Voice filter tabs
  var vt=document.createElement('div');vt.className='vt';
  // All tab
  var tabAll=document.createElement('button');tabAll.className='vtb'+(vf==='all'?' on':'');tabAll.textContent='Todos';
  tabAll.addEventListener('click',function(){vf='all';renderA();});vt.appendChild(tabAll);
  // Director tab
  var tabDir=document.createElement('button');tabDir.className='vtb'+(vf==='director'?' on':'');tabDir.textContent='Director';
  tabDir.addEventListener('click',function(){vf='director';renderA();});vt.appendChild(tabDir);
  VOICES.forEach(function(v){
    var cnt=members.filter(function(m){return m.voice===v;}).length;if(!cnt)return;
    var tb=document.createElement('button');tb.className='vtb'+(vf===v?' on':'');tb.textContent=v+' ('+cnt+')';
    (function(voice){tb.addEventListener('click',function(){vf=voice;renderA();});})(v);
    vt.appendChild(tb);
  });
  frag.appendChild(vt);

  // Cards container — vertical scroll
  var container=document.createElement('div');container.className='cards-container';

  // Build list to show
  var toShow=[];
  if(vf==='all'||vf==='director'){
    toShow.push({isDirector:true,id:'director'});
  }
  if(vf!=='director'){
    var src=vf==='all'?members:members.filter(function(m){return m.voice===vf;});
    src.forEach(function(m){toShow.push({member:m});});
  }

  toShow.forEach(function(item){
    container.appendChild(makeCard(item,dd));
  });

  // Add member button at bottom
  var addBtn=document.createElement('button');addBtn.className='add-member-btn';
  addBtn.innerHTML='+ Agregar integrante';
  addBtn.addEventListener('click',function(){openAdd();});
  container.appendChild(addBtn);

  frag.appendChild(container);
  var app=document.getElementById('app');app.innerHTML='';app.appendChild(frag);
}

function makeCard(item,dd){
  if(item.isDirector){
    return makeDirectorCard(dd);
  }
  var m=item.member;
  var status=dd[m.id]||null;
  var st=mstat(m.id);

  var card=document.createElement('div');
  card.className='mc'+(status?' '+status:'');
  card.id='mc-'+m.id;

  var acc=document.createElement('div');acc.className='mac';card.appendChild(acc);

  // Card inner: horizontal layout — photo left, info right
  var inner=document.createElement('div');inner.className='mc-inner';

  // Photo — square, large
  var photoWrap=document.createElement('div');photoWrap.className='mc-photo-wrap';
  if(m.photo){
    var img=document.createElement('img');
    img.className='mc-photo';img.src=m.photo;img.loading='lazy';img.alt=m.name;
    photoWrap.appendChild(img);
  }else{
    var pi=document.createElement('div');pi.className='mc-photo-ini';pi.textContent=ini(m.name);
    photoWrap.appendChild(pi);
  }
  inner.appendChild(photoWrap);

  // Info side
  var info=document.createElement('div');info.className='mc-info';

  var nm=document.createElement('div');nm.className='mc-name';nm.textContent=m.name;info.appendChild(nm);
  var vv=document.createElement('div');vv.className='mc-voice';vv.textContent=m.voice;info.appendChild(vv);

  // Status buttons — 3 stacked vertically
  var btns=document.createElement('div');btns.className='mc-btns';
  var bdata=[
    {cls:'g',  base:'g',  label:'\u2713 Presente',   val:'present'},
    {cls:'aa', base:'aa', label:'~ Con aviso',       val:'absent_notified'},
    {cls:'r',  base:'r',  label:'\u2717 Sin aviso',  val:'absent_no_notice'},
  ];
  bdata.forEach(function(b){
    var btn=document.createElement('button');
    btn.className='mbt '+b.cls+(status===b.val?' sel':'');
    btn.setAttribute('data-base',b.base);
    btn.textContent=b.label;
    (function(mid,val){btn.addEventListener('click',function(){setStatus(mid,val);});})(m.id,b.val);
    btns.appendChild(btn);
  });
  info.appendChild(btns);

  // Mini stats
  var ms=document.createElement('div');ms.className='mc-stats';
  [[st.p,'var(--green)','P'],[st.a,'var(--amber)','CA'],[st.s,'var(--red)','SA']].forEach(function(x){
    var s2=document.createElement('div');s2.className='mss';
    var n2=document.createElement('div');n2.className='mssn';n2.style.color=x[1];n2.textContent=x[0];
    var l2=document.createElement('div');l2.className='mssl';l2.textContent=x[2];
    s2.appendChild(n2);s2.appendChild(l2);ms.appendChild(s2);
  });
  info.appendChild(ms);

  // Delete
  var del=document.createElement('button');del.className='mdl';del.innerHTML='&#128465;';
  (function(mid){del.addEventListener('click',function(){openDel(mid);});})(m.id);
  info.appendChild(del);

  inner.appendChild(info);
  card.appendChild(inner);
  return card;
}

function makeDirectorCard(dd){
  var status=dd['director']||null;
  var card=document.createElement('div');
  card.className='mc director-card'+(status?' '+status:'');
  card.id='mc-director';
  var acc=document.createElement('div');acc.className='mac';card.appendChild(acc);
  var inner=document.createElement('div');inner.className='mc-inner';
  var photoWrap=document.createElement('div');photoWrap.className='mc-photo-wrap';
  if(AGUS_PHOTO){
    var img=document.createElement('img');img.className='mc-photo';img.src=AGUS_PHOTO;img.alt='Director';
    photoWrap.appendChild(img);
  }else{
    var pi=document.createElement('div');pi.className='mc-photo-ini';pi.textContent='AC';photoWrap.appendChild(pi);
  }
  inner.appendChild(photoWrap);
  var info=document.createElement('div');info.className='mc-info';
  var nm=document.createElement('div');nm.className='mc-name';nm.textContent='Agust\u00edn Cartabia';info.appendChild(nm);
  var vv=document.createElement('div');vv.className='mc-voice';vv.style.color='#C9A96E';vv.textContent='Director';info.appendChild(vv);
  var btns=document.createElement('div');btns.className='mc-btns';
  var bdata=[{cls:'g',base:'g',label:'\u2713 Presente',val:'present'},{cls:'aa',base:'aa',label:'~ Con aviso',val:'absent_notified'},{cls:'r',base:'r',label:'\u2717 Sin aviso',val:'absent_no_notice'}];
  bdata.forEach(function(b){
    var btn=document.createElement('button');btn.className='mbt '+b.cls+(status===b.val?' sel':'');btn.setAttribute('data-base',b.base);btn.textContent=b.label;
    btn.addEventListener('click',function(){
      if(!att[selDate])att[selDate]={};
      if(att[selDate]['director']===b.val)delete att[selDate]['director'];else att[selDate]['director']=b.val;
      var dirSt=att[selDate]['director'];clean(selDate);save();
      card.className='mc director-card'+(dirSt?' '+dirSt:'');
      btns.querySelectorAll('.mbt').forEach(function(x,i){x.className='mbt '+bdata[i].base+(dirSt===bdata[i].val?' sel':'');});
      var si=document.getElementById('si');if(si){si.style.opacity='1';clearTimeout(savedTimer);savedTimer=setTimeout(function(){si.style.opacity='0';},1400);}
    });
    btns.appendChild(btn);
  });
  info.appendChild(btns);inner.appendChild(info);card.appendChild(inner);
  return card;
}

// ── STATS ──
function renderS(){
  var tot=Object.keys(att).length;
  var app=document.getElementById('app');
  var frag=document.createDocumentFragment();
  var wrap=document.createElement('div');wrap.className='cp';
  var t2=document.createElement('div');t2.className='st';t2.textContent='Estad\u00edsticas';wrap.appendChild(t2);
  var sub=document.createElement('div');sub.style.cssText='font-size:10px;color:var(--mt);margin-bottom:13px';
  sub.innerHTML='Ensayos: <span style="color:var(--g);font-weight:700">'+tot+'</span>';wrap.appendChild(sub);
  var srt=members.slice().sort(function(a,b){var sa=mstat(a.id),sb=mstat(b.id);var ta=sa.p+sa.a+sa.s,tb=sb.p+sb.a+sb.s;return(tb>0?sb.p/tb:0)-(ta>0?sa.p/ta:0);});
  srt.forEach(function(m){
    var st2=mstat(m.id);var t3=st2.p+st2.a+st2.s;var pc=t3>0?Math.round(st2.p/t3*100):0;
    var c=pc>=80?'var(--green)':pc>=60?'var(--amber)':'var(--red)';
    var row=document.createElement('div');row.className='sr';
    if(m.photo){var av=document.createElement('img');av.className='sav';av.src=m.photo;av.loading='lazy';row.appendChild(av);}
    else{var av2=document.createElement('div');av2.className='savi';av2.textContent=ini(m.name);row.appendChild(av2);}
    var info=document.createElement('div');info.style.cssText='flex:1;min-width:0';
    var nm2=document.createElement('div');nm2.style.cssText='font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';nm2.textContent=m.name;info.appendChild(nm2);
    var vc3=document.createElement('div');vc3.style.cssText='font-size:8px;color:var(--mt)';vc3.textContent=m.voice;info.appendChild(vc3);
    var bg3=document.createElement('div');bg3.className='sbg';var bar=document.createElement('div');bar.className='sba';bar.style.cssText='width:'+pc+'%;background:'+c;bg3.appendChild(bar);info.appendChild(bg3);
    row.appendChild(info);
    var pct=document.createElement('div');pct.style.cssText='text-align:right;flex-shrink:0';
    pct.innerHTML='<div style="font-size:16px;font-weight:700;color:'+c+'">'+pc+'%</div><div style="font-size:9px;color:var(--mt)">'+st2.p+'/'+t3+'</div>';
    row.appendChild(pct);wrap.appendChild(row);
  });
  frag.appendChild(wrap);app.innerHTML='';app.appendChild(frag);
}

  wrap.appendChild(btn);frag.appendChild(wrap);app.innerHTML='';app.appendChild(frag);

function doReport(date){
  var dd=att[date]||{};
  var pres=Object.values(dd).filter(function(v){return v==='present';}).length;
  var notif=Object.values(dd).filter(function(v){return v==='absent_notified';}).length;
  var noNot=Object.values(dd).filter(function(v){return v==='absent_no_notice';}).length;
  var total=members.length;
  var pctP=total>0?Math.round(pres/total*100):0;
  var S=1080,cx=S/2,cy=S/2,R=310,ir=175;
  var cv=document.createElement('canvas');cv.width=S;cv.height=S;
  var ctx=cv.getContext('2d');
  ctx.fillStyle='#FFEED7';ctx.fillRect(0,0,S,S);
  var startA=-Math.PI/2;
  [{val:pres,color:'#C9A96E',glow:true},{val:notif,color:'#555555'},{val:noNot,color:'#1a1a1a'}].forEach(function(sl){
    if(sl.val<=0)return;
    var angle=(sl.val/total)*Math.PI*2,gap=total>1?0.02:0;
    if(sl.glow){ctx.shadowColor='rgba(180,130,50,.3)';ctx.shadowBlur=18;}
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,startA+gap,startA+angle-gap);ctx.closePath();
    ctx.fillStyle=sl.color;ctx.fill();ctx.shadowColor='transparent';ctx.shadowBlur=0;startA+=angle;
  });
  ctx.beginPath();ctx.arc(cx,cy,ir,0,Math.PI*2);ctx.fillStyle='#FFEED7';ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,ir,0,Math.PI*2);ctx.strokeStyle='rgba(140,90,20,.2)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='700 76px Montserrat,sans-serif';ctx.fillStyle='#1a1a1a';ctx.fillText(pctP+'%',cx,cy-18);
  ctx.font='400 20px Montserrat,sans-serif';ctx.fillStyle='rgba(40,25,5,.6)';ctx.fillText('asistencia',cx,cy+30);
  var legendY=S-148;
  ctx.strokeStyle='rgba(140,90,20,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-160,legendY-22);ctx.lineTo(cx+160,legendY-22);ctx.stroke();
  [{label:'Presentes',count:pres,pct:pctP,color:'#C9A96E'},{label:'Con aviso',count:notif,pct:total>0?Math.round(notif/total*100):0,color:'#555555'},{label:'Sin aviso',count:noNot,pct:total>0?Math.round(noNot/total*100):0,color:'#1a1a1a'}].forEach(function(item,i){
    var ly=legendY+i*34;
    ctx.beginPath();ctx.arc(cx-145,ly,7,0,Math.PI*2);ctx.fillStyle=item.color;ctx.fill();
    ctx.font='500 16px Montserrat,sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='rgba(30,15,0,.85)';ctx.fillText(item.label,cx-130,ly);
    ctx.font='700 16px Montserrat,sans-serif';ctx.textAlign='right';ctx.fillStyle=item.color;ctx.fillText(item.count+' ('+item.pct+'%)',cx+145,ly);
  });
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='400 20px Montserrat,sans-serif';ctx.fillStyle='rgba(30,15,0,.65)';ctx.fillText(fdate(date),cx,52);
  ctx.font='600 28px Montserrat,sans-serif';ctx.fillStyle='#1a1a1a';ctx.fillText('POLYPHONIA',cx,90);
  ctx.font='300 14px Montserrat,sans-serif';ctx.fillStyle='#1a1a1a';ctx.fillText('asistencia',cx,116);
  ctx.strokeStyle='rgba(140,90,20,.2)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-85,132);ctx.lineTo(cx+85,132);ctx.stroke();
  var url=cv.toDataURL('image/png',1.0);
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if(isIOS){
    var w=window.open();
    if(w){
      w.document.write('<html><head><title>Informe Polyphonia</title></head><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="'+url+'" style="max-width:100%;height:auto" alt="Informe"><p style="position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-family:sans-serif;font-size:14px">Manten\u00e9 presionada la imagen y toc\u00e1 "Guardar imagen"</p></body></html>');
      w.document.close();
    }else{
      alert('Habilit\u00e1 las ventanas emergentes para exportar la imagen, o toc\u00e1 y manten\u00e9 presionado este bot\u00f3n de nuevo.');
    }
  }else{
    var a=document.createElement('a');a.download='polyphonia-asistencia-'+date+'.png';a.href=url;document.body.appendChild(a);a.click();document.body.removeChild(a);
  }
}

// ── ADD / DELETE ──
function openAdd(){
  document.getElementById('nname').value='';
  document.getElementById('nvoice').value='Soprano';
  document.getElementById('ppreview').style.display='none';
  document.getElementById('ptext').style.display='block';
  document.getElementById('sh-add').classList.add('on');
  setTimeout(function(){document.getElementById('nname').focus();},80);
}
document.getElementById('pfile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r2=new FileReader();r2.onload=function(ev){
    pph=ev.target.result;
    var img=document.getElementById('ppreview');img.src=pph;img.style.display='block';
    document.getElementById('ptext').style.display='none';
  };r2.readAsDataURL(f);
});
document.getElementById('btn-confirm-add').addEventListener('click',function(){
  var name=document.getElementById('nname').value.trim();if(!name)return;
  members.push({id:uid(),name:name,voice:document.getElementById('nvoice').value,photo:pph||''});
  save();closeSheet('sh-add');render();
});
document.getElementById('btn-cancel-add').addEventListener('click',function(){closeSheet('sh-add');});

function openDel(id){
  delId=id;
  var m=members.find(function(m){return m.id==id;});
  document.getElementById('del-msg').textContent='\u00bfEliminar a '+(m?m.name:'este integrante')+'? No se puede deshacer.';
  document.getElementById('sh-del').classList.add('on');
}
document.getElementById('btn-confirm-del').addEventListener('click',function(){
  if(!delId)return;
  members=members.filter(function(m){return m.id!=delId;});
  Object.keys(att).forEach(function(d){if(att[d])delete att[d][delId];});
  save();delId=null;closeSheet('sh-del');render();
});
document.getElementById('btn-cancel-del').addEventListener('click',function(){closeSheet('sh-del');});

function closeSheet(id){document.getElementById(id).classList.remove('on');}
document.querySelectorAll('.ov').forEach(function(o){o.addEventListener('click',function(e){if(e.target===o)o.classList.remove('on');});});

document.getElementById('nb-a').addEventListener('click',function(){sw('a');});
document.getElementById('nb-h').addEventListener('click',function(){sw('h');});
document.getElementById('nb-s').addEventListener('click',function(){sw('s');});
document.getElementById('nb-r').addEventListener('click',function(){sw('r');});

function render(){if(view==='a')renderA();else if(view==='h')renderH();else if(view==='s')renderS();else renderR();}
render();
